name: Verify static share pages

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify share pages
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Regenerate static share pages
        run: node tools/build_share_pages.js

      - name: Check generated pages
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain -- articles/)" ]]; then
            echo "::error::静态分享页没有同步。请运行 node tools/build_share_pages.js，并提交 articles/ 目录中的变化。"
            git status --short -- articles/
            exit 1
          fi

          echo "静态分享页已经同步。"
